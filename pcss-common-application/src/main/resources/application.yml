spring:
  application:
    name: jag-pcss-common

management:
  server:
    port: ${MANAGEMENT_PORT:-1}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        pcss.soap.server.requests: 100ms,250ms,500ms,1s,2s,5s,10s,15s,30s,60s,120s

security:
  basic-auth:
    password: ${BASIC_AUTH_PASS}
    username: ${BASIC_AUTH_USER}
pcss:
  host: ${ORDS_HOST}
  username: ${ORDS_USERNAME}
  password: ${ORDS_PASSWORD}
  adobe-host: ${ADOBE_HOST}
  oracle-host: ${ORACLE_HOST}
  oracle-name: ${ORACLE_NAME}
  generic-agent-id: ${GENERIC_AGEN_ID}
  generic-part-id: ${GENERIC_PART_ID}
  ords-read-timeout: ${ORDS_READ_TIMEOUT}
